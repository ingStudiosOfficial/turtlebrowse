name: Build multi-platform binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-jar:
    name: Build Shadow JAR
    runs-on: ubuntu-latest
    outputs:
      artifact-name: shadow-jar-${{ github.run_id }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Shadow JAR
        shell: bash
        run: |
          ./gradlew shadowJar \
            -Porg.gradle.java.installations.auto-detect=false \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME

      - name: Upload Shadow JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-jar-${{ github.run_id }}
          path: app/build/libs/app-all.jar

  jpackage:
    name: Package for ${{ matrix.os-name }} (${{ matrix.arch }})
    needs: build-jar
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os-name: macOS
            arch: ARM64

          - os: windows-latest
            os-name: Windows
            arch: AMD64
          - os: windows-11-arm
            os-name: Windows
            arch: ARM64

          - os: ubuntu-latest
            os-name: Ubuntu
            arch: AMD64
            pkg-type: deb
          - os: ubuntu-24.04-arm
            os-name: Ubuntu
            arch: ARM64
            pkg-type: deb

          - os: ubuntu-latest
            os-name: Fedora
            arch: AMD64
            pkg-type: rpm
          - os: ubuntu-24.04-arm
            os-name: Fedora
            arch: ARM64
            pkg-type: rpm

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Packaging Tools (Fedora/Ubuntu specific)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.os-name }}" = "Fedora" ]; then
            sudo apt-get install -y rpm
          else
            sudo apt-get install -y fakeroot dpkg devscripts
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Debug JDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          ls "$JAVA_HOME/jmods" | head

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Built Shadow JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-jar.outputs.artifact-name }}
          path: app/build/libs/

      - name: Run jpackage via Gradle
        shell: bash
        run: |
          ./gradlew jpackage \
            -Porg.gradle.java.installations.auto-detect=false \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME \
            -PtargetOs="${{ matrix.os-name }}" \
            -PtargetArch="${{ matrix.arch }}" \
            -PtargetPkgType="${{ matrix.pkg-type }}" --info

      - name: Upload Native Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: turtlebrowse_${{ matrix.os-name }}_${{ matrix.arch }}
          path: |
            app/build/libs/app-all.jar
            app/build/dist/*.deb
            app/build/dist/*.rpm
            app/build/dist/*.exe
            app/build/dist/*.msi
            app/build/dist/*.dmg
            app/build/dist/*.pkg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-jar, jpackage]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/') && (needs.build-jar.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Work Directory
        run: |
          mkdir -p release-artifacts/final-assets

      - name: Download All Native Installers and Jars
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          pattern: turtlebrowse_*
          merge-multiple: false

      - name: Rename Shadow JAR
        run: |
          ANY_JAR=$(find release-artifacts/ -name "app-all.jar" | head -n 1)

          if [ -f "$ANY_JAR" ]; then
            cp "$ANY_JAR" release-artifacts/final-assets/turtlebrowse_jar.jar
            echo "Successfully found and copied shadow JAR."
          else
            echo "Error: app-all.jar not found anywhere in downloaded artifacts."
            echo "Current directory structure for debugging:"
            ls -R release-artifacts/
            exit 1
          fi

      - name: Rename Dist Artifacts
        run: |
          cd release-artifacts/

          for dir in turtlebrowse_*; do
            [ -d "$dir" ] || continue

            IFS='_' read -r _ os_name arch_name <<< "$dir"

            os_lower=$(echo "$os_name" | tr '[:upper:]' '[:lower:]')
            arch_lower=$(echo "$arch_name" | tr '[:upper:]' '[:lower:]')

            if [ "$os_lower" = "ubuntu" ]; then
              os_lower="debian"
            fi

            if [ -d "$dir/dist" ]; then
              find "$dir/dist" -type f | while read -r file; do
                ext="${file##*.}"

                new_filename="turtlebrowse_${os_lower}_${arch_lower}.${ext}"
                echo "Moving $file to final-assets/$new_filename"
                cp "$file" "final-assets/$new_filename"
              done
            fi
          done

      - name: Display Collected Assets
        run: ls -R release-artifacts/final-assets/

      - name: Parse Version Tag
        id: version_parser
        run: |
          CLEAN_VERSION="${{ github.ref_name }}"
          echo "clean=${CLEAN_VERSION#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Version ${{ steps.version_parser.outputs.clean }}${{ startsWith(github.ref_name, 'v0.') && ' Beta' || '' }}"
          draft: false
          make_latest: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            release-artifacts/final-assets/*
          body: >
            # Turtlebrowse Version ${{ steps.version_parser.outputs.clean }}${{ startsWith(github.ref_name, 'v0.') && ' Beta' || '' }}

            ## Installation

            ### Windows

            Download the executable and follow the setup wizard. Open Turtlebrowse. Complete the browser personalization wizard and wait for Java CEF to download. Turtlebrowse will launch once downloaded.

            ### Linux

            ### Debian/Ubuntu

            Download the ```.deb``` file and run ```sudo apt install ./turtlebrowse_debian_[arch].deb```. Complete the browser personalization wizard and wait for Java CEF to download. Turtlebrowse will launch once downloaded.

            ### Fedora/openSUSE

            Download the ```.rpm``` file.

            #### Fedora

            Run ```sudo dnf install ./turtlebrowse_fedora_[arch].rpm```.

            #### openSUSE

            Run ```sudo zypper install ./turtlebrowse_fedora_[arch].rpm```.

            Complete the browser personalization wizard and wait for Java CEF to download. Turtlebrowse will launch once downloaded.

            ### Executing from JAR

            Download the JAR file and run ```java -jar turtlebrowse_jar.jar```. Complete the browser personalization wizard and wait for Java CEF to download. Turtlebrowse will launch once downloaded.